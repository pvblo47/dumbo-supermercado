name: CI

on:
  push:
    branches: [main, dev, frontend, backend]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flujo-ramas:
    runs-on: ubuntu-latest
    steps:
      - name: Validar el origen del pull request
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Push de trabajo: la integración se valida al abrir el pull request."
            exit 0
          fi
          if [[ "$BASE_BRANCH" == "main" ]] && { [[ "$HEAD_BRANCH" != "dev" ]] || [[ "$HEAD_REPOSITORY" != "$CURRENT_REPOSITORY" ]]; }; then
            echo "::error::Los pull requests a main deben venir de dev de este repositorio. Integra primero tu trabajo en dev."
            exit 1
          fi
          echo "Origen del pull request permitido."

  backend:
    runs-on: ubuntu-latest
    needs: flujo-ramas
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dumbo_test
          POSTGRES_USER: dumbo
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dumbo -d dumbo_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DUMBO_TEST_DATABASE: Host=127.0.0.1;Port=5432;Database=dumbo_test;Username=dumbo;Password=ci-ephemeral-only;Timeout=3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - run: dotnet restore backend/Dumbo.sln --locked-mode --configfile NuGet.config
      - run: dotnet test backend/Dumbo.sln --configuration Release --no-restore

  frontend:
    runs-on: ubuntu-latest
    needs: flujo-ramas
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm run build
      - run: npm run test:ci

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f backend/Dockerfile -t dumbo-api:ci .
      - run: docker build -f frontend/Dockerfile -t dumbo-web:ci .
