name: CI

on:
  push:
    branches: [main, dev, frontend, backend]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: pvbl0dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  flujo-ramas:
    runs-on: ubuntu-latest
    steps:
      - name: Validar el origen del pull request
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Push de trabajo: la integración se valida al abrir el pull request."
            exit 0
          fi
          if [[ "$BASE_BRANCH" == "main" ]] && { [[ "$HEAD_BRANCH" != "dev" ]] || [[ "$HEAD_REPOSITORY" != "$CURRENT_REPOSITORY" ]]; }; then
            echo "::error::Los pull requests a main deben venir de dev de este repositorio. Integra primero tu trabajo en dev."
            exit 1
          fi
          echo "Origen del pull request permitido."

  backend:
    runs-on: ubuntu-latest
    needs: flujo-ramas
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dumbo_test
          POSTGRES_USER: dumbo
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dumbo -d dumbo_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DUMBO_TEST_DATABASE: Host=127.0.0.1;Port=5432;Database=dumbo_test;Username=dumbo;Password=ci-ephemeral-only;Timeout=3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - run: dotnet restore backend/Dumbo.sln --locked-mode --configfile NuGet.config
      - run: dotnet test backend/Dumbo.sln --configuration Release --no-restore

  frontend:
    runs-on: ubuntu-latest
    needs: flujo-ramas
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm run build
      - run: npm run test:ci

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f backend/Dockerfile --label org.opencontainers.image.revision="$GITHUB_SHA" --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t dumbo-api:ci .
      - run: docker build -f frontend/Dockerfile --label org.opencontainers.image.revision="$GITHUB_SHA" --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t dumbo-web:ci .
      - name: Comprobar configuracion Nginx local
        run: docker run --rm --add-host api:127.0.0.1 dumbo-web:ci nginx -t
      - name: Comprobar proxy hacia un backend configurable
        run: |
          cleanup() {
            docker rm -f dumbo-web-smoke dumbo-api-smoke >/dev/null 2>&1 || true
            docker network rm dumbo-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create dumbo-smoke
          docker run -d --name dumbo-api-smoke --network dumbo-smoke dumbo-api:ci
          docker run -d --name dumbo-web-smoke --network dumbo-smoke -e API_UPSTREAM=http://dumbo-api-smoke:8080 dumbo-web:ci
          docker exec dumbo-web-smoke nginx -t
          for attempt in $(seq 1 20); do
            if response=$(docker exec dumbo-web-smoke wget -qO- http://127.0.0.1/api/health); then
              printf '%s' "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["status"] == "ok" and data["service"] == "dumbo-api"'
              exit 0
            fi
            sleep 1
          done
          docker logs dumbo-api-smoke
          docker logs dumbo-web-smoke
          exit 1
      - name: Verificar configuracion de Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Configura el secret DOCKERHUB_TOKEN con permiso de escritura para pvbl0dev antes de publicar desde main."
            exit 1
          fi
      - name: Iniciar sesion en Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publicar las imagenes verificadas
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          version="sha-${GITHUB_SHA}"
          frontend_image="${DOCKERHUB_USERNAME}/dumbo-frontend"
          backend_image="${DOCKERHUB_USERNAME}/dumbo-backend"

          # Primero se publican ambas versiones identificadas por commit.
          docker tag dumbo-web:ci "${frontend_image}:${version}"
          docker tag dumbo-api:ci "${backend_image}:${version}"
          docker push "${frontend_image}:${version}"
          docker push "${backend_image}:${version}"

          # Los alias de la clase avanzan despues de publicar ambas versiones.
          docker tag "${frontend_image}:${version}" "${frontend_image}:latest"
          docker tag "${backend_image}:${version}" "${backend_image}:latest"
          docker push "${frontend_image}:latest"
          docker push "${backend_image}:latest"

          {
            echo '## Imagenes publicadas en Docker Hub'
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            echo '| Servicio | Version por commit | Referencia con digest |'
            echo '| --- | --- | --- |'
            for image in "$frontend_image" "$backend_image"; do
              digest=$(docker image inspect "${image}:${version}" --format '{{index .RepoDigests 0}}')
              printf '| `%s` | `%s:%s` | `%s` |\n' "$image" "$image" "$version" "$digest"
            done
            echo
            echo 'Publicacion completada. Esta ejecucion no actualiza las VM.'
          } >> "$GITHUB_STEP_SUMMARY"
